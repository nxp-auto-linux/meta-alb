# This file contains extra machine settings intended
# for the s32n79rdb Yocto machine. Its content will be
# automatically added with the current layer's inclusion
# in BBLAYERS, since the fsl-auto.conf DISTRO
# performs "include conf/machine/${MACHINE}-extra.conf"
# Copyright 2025 NXP

KERNEL_DEVICETREE_EXT = "s32n79-rdb-hw-partition-1.1.5.dtb"
# Use KERNEL_DEVICETREE_OVERRIDE because KERNEL_DEVICETREE will be computed
# by the linux recipe based on KERNEL_DEVICETREE_EXT.
KERNEL_DEVICETREE_OVERRIDE = "s32n79-rdb-hw-partition-1.1.5.dtb"

# Out of tree TFA DTB.
TFA_DTB_EXT = "1"

BOOT_TYPE = "sdcard"
IMAGE_FSTYPES:remove = "ufs"
