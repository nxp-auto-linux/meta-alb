BBPATH =. "${LAYERDIR}:"

BBFILE_COLLECTIONS += "hw-partition-1.1.6"
BBFILE_PATTERN_hw-partition-1.1.6 := "^${LAYERDIR}"
BBFILE_PRIORITY_hw-partition-1.1.6 = "12"

BBFILES += " \
        ${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend \
        ${LAYERDIR}/classes/*.bb* \
"

# Set LAYERSERIES_COMPAT variable for meta-alb-hw-partition-1.1.6 layer
# to match the version "scarthgap" of OpenEmbedded-Core
LAYERSERIES_COMPAT_hw-partition-1.1.6 = "scarthgap"

RELEASE_BASE ?= "develop"
