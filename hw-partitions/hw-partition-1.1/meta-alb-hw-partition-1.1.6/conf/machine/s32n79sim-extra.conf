# This file contains extra machine settings intended
# for the s32n79sim Yocto machine. Its content will be
# automatically added with the current layer's inclusion
# in BBLAYERS, since the fsl-auto.conf DISTRO
# performs "include conf/machine/${MACHINE}-extra.conf"
# Copyright 2025 NXP

KERNEL_DEVICETREE_EXT = "s32n79-simulator-hw-partition-1.1.6.dtb"
# Use KERNEL_DEVICETREE_OVERRIDE because KERNEL_DEVICETREE will be computed
# by the linux recipe based on KERNEL_DEVICETREE_EXT.
KERNEL_DEVICETREE_OVERRIDE = "s32n79-simulator-hw-partition-1.1.6.dtb"

# Out of tree TFA DTB.
TFA_DTB_EXT = "1"

BOOT_TYPE = "ufs"
IMAGE_FSTYPES:remove = "sdcard"

SERIAL_CONSOLES = "115200;ttyAMA7"
SERIAL_CONSOLES_CHECK = "ttyAMA7:ttyAMA7"
