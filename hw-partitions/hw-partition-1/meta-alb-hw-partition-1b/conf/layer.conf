BBPATH =. "${LAYERDIR}:"

BBFILE_COLLECTIONS += "hw-partition-1b"
BBFILE_PATTERN_hw-partition-1b := "^${LAYERDIR}"
BBFILE_PRIORITY_hw-partition-1b = "12"

BBFILES += " \
        ${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend \
        ${LAYERDIR}/classes/*.bb* \
"

# Set LAYERSERIES_COMPAT variable for meta-alb-hw-partition-1b layer
# to match the version "scarthgap" of OpenEmbedded-Core
LAYERSERIES_COMPAT_hw-partition-1b = "scarthgap"

RELEASE_BASE ?= "develop"
