#@TYPE: Machine
#@NAME: NXP S32G274AEVB
#@SOC: s32g274a
#@DESCRIPTION: Machine configuration for running the S32G274AEVB in 64-bit mode
#@MAINTAINER: Catalin Dan Udma <catalin-dan.udma@nxp.com>
# Copyright 2017-2019 NXP

require conf/machine/include/s32g2evb.inc

# Remove the following setting once 'linux-s32' and 'linux-upstream'
# packages will have the same naming convention for the Linux Kernel DTB
# file in case of 's32g274aevb' machine target.
KERNEL_DEVICETREE ?= "${@'freescale/s32g274a-evb.dtb' if d.getVar('PREFERRED_PROVIDER_virtual/kernel') == 'linux-upstream' else 'freescale/s32g2xxa-evb.dtb'}"
