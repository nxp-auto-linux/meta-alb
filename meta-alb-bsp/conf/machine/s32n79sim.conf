#@TYPE: Machine
#@NAME: NXP S32N79 SIMULATOR
#@SOC: s32n79
#@DESCRIPTION: Machine configuration for running the S32N SIMULATOR in 64-bit mode
#@MAINTAINER: Radu Daia <radu.daia@nxp.com>
# Copyright 2024-2025 NXP

require conf/machine/include/s32n-sim-base.inc

SOC_FAMILY:append = ":s32n7sim"
MACHINEOVERRIDES =. "s32n7sim:"

KERNEL_DEVICETREE ?= "freescale/s32n79-simulator.dtb"
TFA_PLAT = "s32n79sim"

UBOOT_DEFCONFIG = "s32n79sim_defconfig"
UBOOT_MMC_DEFCONFIG = "s32n79sim_mmc_defconfig"
UBOOT_CONFIG ?= "ufs sdcard"
UBOOT_CONFIG[ufs] = "${UBOOT_DEFCONFIG},,u-boot-nodtb.${UBOOT_SUFFIX}"
UBOOT_CONFIG[sdcard] = "${UBOOT_MMC_DEFCONFIG},,u-boot-nodtb.${UBOOT_SUFFIX}"

IMAGE_FSTYPES += "cpio.gz.u-boot ext4"
SERIAL_CONSOLES ?= "115200;ttyAMA0"
SERIAL_CONSOLES_CHECK ?= "ttyAMA0:ttyAMA0 ttyAMA1:ttyAMA1 ttyAMA2:ttyAMA2 " \
                         "ttyAMA3:ttyAMA3 ttyAMA4:ttyAMA4 ttyAMA5:ttyAMA5 " \
			 "ttyAMA6:ttyAMA6 ttyAMA7:ttyAMA7"

EXTRA_IMAGECMD:ext4 = "-i 4096 -b 4096 -L ${IMAGE_NAME}"
