#@TYPE: Machine
#@NAME: NXP S32R478AEVB
#@SOC: s32r478
#@DESCRIPTION: Machine configuration for running the S32R478AEVB in 64-bit mode
#@MAINTAINER: Catalin Dan Udma <catalin-dan.udma@nxp.com>
# Copyright 2025 NXP

require conf/machine/include/s32r478.inc

TFA_PLAT = "s32r478aevb"

UBOOT_FLASH_DEFCONFIG = "s32r478aevb_qspi_defconfig"

# TF-A and U-Boot should use the 's32r478a-evb.dtb' file.
# Only the Linux Kernel needs a 's32r47_w_r45.dtb' dtb file when running
# the M7 Bootloader prototype on S32R45-EVB board.
KERNEL_DEVICETREE_OVERRIDE = "freescale/s32r478a-evb.dtb"

KERNEL_DEVICETREE ?= "${@bb.utils.contains('VALIDATION_HW', 'S32R47_W_S32R45', 'freescale/s32r47_w_r45.dtb', 'freescale/s32r478a-evb.dtb', d)}"
FLASHIMAGE_DTB_FILE = "${@bb.utils.contains('VALIDATION_HW', 'S32R47_W_S32R45', 's32r47_w_r45.${FLASHIMAGE_DTB_SUFFIX}', 's32r478a-evb.${FLASHIMAGE_DTB_SUFFIX}', d)}"
